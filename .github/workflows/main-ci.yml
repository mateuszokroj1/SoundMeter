# This is a basic workflow to help you get started with Actions

name: Main CI

env:
  solution-path: '${{ github.workspace }}/src/SoundMeter.slnx'
  DOTNET_ROOT: '$HOME/dotnet'
  DOTNET_INSTALL_DIR: '$HOME/dotnet'

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ${{ matrix.runsOn }}
    name: Main CI build

    timeout-minutes: 30

    strategy:
      matrix:
        runsOn: ['windows-latest', 'windows-11-arm', 'macos-latest', 'macos-15-intel']

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:

      - name: Cache
        uses: actions/cache@v6.1.0
        with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path: '${{ github.workspace }}'
          # An explicit key for restoring and saving the cache
          key: main-ci-${{ runner.os }}-cache
          # An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.

      - name: Cache
        uses: actions/cache@v6.1.0
        with:
          # A list of files, directories, and wildcard patterns to cache and restore
          path: ${{ env.DOTNET_ROOT }}
          # An explicit key for restoring and saving the cache
          key: main-ci-dotnet-${{ runner.os }}-cache
          # An ordered multiline string listing the prefix-matched keys, that are used for restoring stale cache if no cache hit occurred for key. Note `cache-hit` returns false in this case.
    
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7.0.1
        timeout-minutes: 5
        name: Git Checkout

      - name: Get branch name
        id: get-branch-name
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            tmp="${{ github.head_ref }}"
          else
            tmp="${GITHUB_REF##*/}"
          fi

          echo "BRANCH=${tmp//\//_}" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v6.0.0
        with:
          workloads: maui

      - name: .NET restore
        timeout-minutes: 5
        run: dotnet restore ${{ env.solution-path }}

      - name: .NET build Debug
        timeout-minutes: 20
        run: dotnet build ${{ env.solution-path }} --configuration Debug

      - name: .NET run tests
        timeout-minutes: 20
        run: dotnet test ${{ env.solution-path }}
        continue-on-error: true

      - name: Set current date as env variable
        id: datetime
        shell: bash
        run: echo "NOW=$(date +'%Y-%m-%dT%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          # Artifact name. If the `archive` input is `false`, the name of the file uploaded will be the artifact name.
          name: SoundMeter-MainCI-${{ steps.get-branch-name.outputs.BRANCH }}-${{ runner.os }}-${{ steps.datetime.outputs.NOW }}
          # A file, directory or wildcard pattern that describes what to upload.
          path: '${{ github.workspace }}'
          retention-days: 31

  sonar:
    runs-on: windows-latest
    needs: build

    name: SonarCloud Scanner

    continue-on-error: true

    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v6.0.1
        with:
          # The Java version to set up. Takes a whole or semver Java version, or the "latest" alias to use the newest available stable release. See examples of supported syntax in README file
          java-version: 21
          distribution: 'zulu'

      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v5.1.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
          
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@v5.1.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
          
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
          
      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: powershell
        continue-on-error: true
        run: |
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"mateuszokroj1_SoundMeter" /o:"mateuszokroj1" /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          dotnet build ${{ env.solution-path }}
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
